          <app-icon [name]="item.icon" />

      </li>
    }
  </ul>
  <p class="nav-label nav-label--secondary">ORGANIZAÇÃO</p>
  <ul>

      <button type="button" class="nav-item" disabled title="Disponível em uma próxima etapa">

      </button>
    </li>
  </ul>
</nav>
