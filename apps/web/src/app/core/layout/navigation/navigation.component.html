<nav aria-label="Navegação principal">
  <p class="nav-label">ESPAÇO DE TRABALHO</p>
  <ul>
    <li>
      <a class="nav-item" routerLink="/" routerLinkActive="nav-item--active" [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page" (click)="navigated.emit()">
        <app-icon name="dashboard" />
        <span>Dashboard</span>
      </a>
    </li>
    @for (item of workspaceItems; track item.label) {
      <li>
        <button type="button" class="nav-item" disabled title="Disponível em uma próxima etapa">
          <app-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </button>
      </li>
    }
    <li>
      <a class="nav-item" routerLink="/tasks" routerLinkActive="nav-item--active" ariaCurrentWhenActive="page"
        (click)="navigated.emit()">
        <app-icon name="tasks" />
        <span>Todas as tarefas</span>
      </a>
    </li>
    <li>
      <a class="nav-item" routerLink="/members" routerLinkActive="nav-item--active" ariaCurrentWhenActive="page"
        (click)="navigated.emit()">
        <app-icon name="members" />
        <span>Membros</span>
      </a>
    </li>
  </ul>
  <p class="nav-label nav-label--secondary">ORGANIZAÇÃO</p>
  <ul>
    <li>
      <button type="button" class="nav-item" disabled title="Disponível em uma próxima etapa">
        <app-icon name="settings" />
        <span>Configurações</span>
      </button>
    </li>
  </ul>
</nav>
