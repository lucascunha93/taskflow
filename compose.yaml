services:
  postgres:
    image: postgres:17-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Armazenamento compatível com S3 para anexos (SeaweedFS). Credenciais no .env da raiz.
  object-storage:
    image: chrislusf/seaweedfs:4.50
    container_name: taskflow-object-storage
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$S3_ACCESS_KEY_ID" ] || [ -z "$$S3_SECRET_ACCESS_KEY" ]; then
          echo "Defina S3_ACCESS_KEY_ID e S3_SECRET_ACCESS_KEY para o armazenamento de anexos." >&2; exit 1
        fi
        printf '{"identities":[{"name":"taskflow","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=8
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - taskflow_object_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Monitoramento (opcional): docker compose --profile monitoring up -d ---
  # Banco exclusivo do GlitchTip; não compartilha dados com o TaskFlow.
  glitchtip-postgres:
    image: postgres:17-alpine
    container_name: taskflow-glitchtip-postgres
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?Defina GLITCHTIP_DB_PASSWORD no .env da raiz}
    volumes:
      - taskflow_glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura de erros compatível com os SDKs do Sentry. Sem Valkey: o próprio
  # PostgreSQL guarda fila, cache e sessões. Interface em http://localhost:8010.
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    container_name: taskflow-glitchtip
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/glitchtip
      VALKEY_URL: ""
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?Defina GLITCHTIP_SECRET_KEY no .env da raiz}
      GLITCHTIP_DOMAIN: http://localhost:8010
      DEFAULT_FROM_EMAIL: glitchtip@taskflow.local
      # Os e-mails de alerta vão para o log do contêiner; configure SMTP para recebê-los.
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_USER_REGISTRATION: "False"
      ENABLE_ADMIN: "False"
      GLITCHTIP_ENABLE_UPTIME: "False"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - taskflow_glitchtip_uploads:/code/uploads

  # Disponibilidade: consulta a API e o web e avisa por e-mail, Telegram, Discord etc.
  # Interface em http://localhost:3001; no contêiner, a API do computador é host.docker.internal:3000.
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8-slim
    container_name: taskflow-uptime-kuma
    profiles: ["monitoring"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - taskflow_uptime_kuma_data:/app/data

volumes:
  taskflow_postgres_data:
  taskflow_object_storage_data:
  taskflow_glitchtip_postgres_data:
  taskflow_glitchtip_uploads:
  taskflow_uptime_kuma_data:
